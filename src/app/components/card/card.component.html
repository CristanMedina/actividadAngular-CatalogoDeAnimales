<div class="card mb-3 border-0 shadow-sm" (click)="selectCard()">
  <div class="row g-0">
    <div class="col-md-4">
      <img [src]="myCard.image" class="img-fluid rounded-start" height="50" width="200" alt="{{ myCard.title }}">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title fw-bold">{{ myCard.title }}</h5>
        <p class="card-text">{{ myCard.description }}</p>
      </div>
    </div>
  </div>
</div>
